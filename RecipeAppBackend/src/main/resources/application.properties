spring.application.name=RecipeAppBackend
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://bwnbvtbhcmeifsmlvmgl.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

spring.datasource.url=jdbc:postgresql://aws-0-eu-north-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.bwnbvtbhcmeifsmlvmgl
# Secret — comes from the environment, never hardcoded here. SUPABASE_DB_PASSWORD
# is set in the IntelliJ run configuration (and must be set in any shell or
# deployment environment that runs the app).
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate

# BUGFIX (review issue #6, open-in-view): Spring's default keeps the JPA
# session open for the entire HTTP request, which silently "rescues" lazy
# loading done outside a transaction (e.g. in a controller or during JSON
# serialization) by firing hidden extra queries. Disabling it makes those
# mistakes throw LazyInitializationException during development instead of
# becoming invisible N+1 performance bugs in production.
spring.jpa.open-in-view=false

# Frontend origins allowed to call this API from a browser (comma-separated).
app.cors.allowed-origins=http://localhost:5173

# Public base URL of the recipe-photos storage bucket (public read); photo URLs are base + "/" + path.
app.storage.photos-public-base-url=https://bwnbvtbhcmeifsmlvmgl.supabase.co/storage/v1/object/public/recipe-photos

# Hard cap on ?size= for all paginated endpoints.
spring.data.web.pageable.max-page-size=50

# Stable Page JSON shape {"content":[...],"page":{...}} — property (not the
# @EnableSpringDataWebSupport annotation) so Boot auto-config stays active
# and the max-page-size cap above keeps working.
spring.data.web.pageable.serialization-mode=via-dto

# Jackson 3 fails on null/missing values for primitive fields by default.
# Our create DTOs use primitive booleans deliberately (absent flag = false),
# so restore the lenient behavior.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Custom path for the interactive Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path for the OpenAPI JSON schema
springdoc.api-docs.path=/api-docs

# Review emails. Gmail SMTP with an app password; MAIL_USERNAME and MAIL_PASSWORD come from the
# environment (IntelliJ run configuration). While MAIL_USERNAME is blank the emails are only logged.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the web app, used for the links in emails.
plateful.frontend-url=${FRONTEND_URL:http://localhost:5173}
